[package]
name = "ait-runner"
version = "1.1.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
ait-core = { path = ".ait-external/ait-core/rust/crates/ait-core" }
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
libc = "0.2.186"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
toml = "0.8.23"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
