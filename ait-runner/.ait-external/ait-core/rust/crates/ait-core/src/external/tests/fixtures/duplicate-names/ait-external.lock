format = "ait.external.lock"

[[node]]
name = "ait-db"
repo_name = "ait-db"
repository_index = 11
remote = "origin"
line = "main"
snapshot = "SNP-DB-DUPLICATE-PARENT"
parent_path = ""
materialize_to = ".ait-external/ait-db"
license = "Apache-2.0"

[[node]]
name = "ait-codec"
repo_name = "ait-codec"
repository_index = 12
remote = "origin"
line = "main"
snapshot = "SNP-CODEC-FOR-DB"
parent_path = ".ait-external/ait-db"
materialize_to = ".ait-external/ait-db/.ait-external/ait-codec"
license = "Apache-2.0"

[[node.binding]]
language = "rust"
kind = "cargo-path"
path = "rust/crates/ait-codec"

[[node]]
name = "ait-tools"
repo_name = "ait-tools"
repository_index = 13
remote = "origin"
line = "main"
snapshot = "SNP-TOOLS-DUPLICATE-PARENT"
parent_path = ""
materialize_to = ".ait-external/ait-tools"
license = "Apache-2.0"

[[node]]
name = "ait-codec"
repo_name = "ait-codec"
repository_index = 15
remote = "origin"
line = "main"
snapshot = "SNP-CODEC-FOR-TOOLS"
parent_path = ".ait-external/ait-tools"
materialize_to = ".ait-external/ait-tools/.ait-external/ait-codec"
license = "Apache-2.0"

[[node.binding]]
language = "rust"
kind = "cargo-path"
path = "rust/crates/ait-codec"
