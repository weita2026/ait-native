[build-system]
requires = ["maturin==1.13.3"]
build-backend = "maturin"

[project]
name = "ait-python"
version = "1.0.0rc8"
description = "In-process PyO3 bindings for the Rust-owned AIT runtime"
readme = { text = "Direct Python bindings for ait-core and its ait-agent runtime.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/abi3-py311"]
manifest-path = "../ait-core/rust/crates/ait-py/Cargo.toml"
module-name = "ait_py"
python-source = "src"
python-packages = ["ait_py", "ait_python"]
locked = true
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
