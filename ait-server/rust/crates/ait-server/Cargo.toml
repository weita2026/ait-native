[package]
name = "ait-server"
version = "1.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
autobins = false

[[bin]]
name = "ait-server"
path = "src/main.rs"

[features]
perfetto-tracing = ["ait-server-core/perfetto-tracing"]

[dependencies]
ait-server-core = { path = "../ait-server-core" }
axum = { version = "0.6", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync"] }
tower = { version = "0.4", features = ["util"] }
zstd = "0.13.3"

[dev-dependencies]
hyper = { version = "0.14", features = ["full"] }
