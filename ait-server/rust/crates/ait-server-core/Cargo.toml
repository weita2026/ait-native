[package]
name = "ait-server-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
autobins = false

[lib]
name = "ait_server_core"
path = "src/lib.rs"

[features]
legacy-postgres-runtime = ["dep:postgres"]
patch-ci-harness = []
perfetto-tracing = []

[[bin]]
name = "ait-server-core-seam"
path = "src/bin/ait-server-core-seam.rs"
required-features = ["patch-ci-harness"]

[[bin]]
name = "ait-server-core-postgres-driver"
path = "src/bin/ait-server-core-postgres-driver.rs"
required-features = ["legacy-postgres-runtime"]

[[test]]
name = "patchset_integration_harness"
path = "tests/patchset_integration_harness.rs"
required-features = ["patch-ci-harness"]

[[test]]
name = "seam_contract_direct_tests"
path = "tests/seam_contract_direct_tests.rs"
required-features = ["patch-ci-harness"]

[dependencies]
base64 = "0.22"
blake2b_simd = "1.0"
bytes = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
getrandom = "0.3"
libc = "0.2"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }
regex = "1.11"
scrypt = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.6"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.12"
