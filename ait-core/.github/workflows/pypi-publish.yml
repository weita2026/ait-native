name: ait release endpoint publication

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact protected release-family identity
        required: true
        type: string
      protected_run_id:
        description: Exact successful protected-promotion workflow run ID
        required: true
        type: string
      endpoint_config_sha256:
        description: SHA-256 of the canonical endpoint configuration
        required: true
        type: string
      endpoint_config_b64:
        description: Base64 of the canonical endpoint configuration generated by release_operator.sh
        required: true
        type: string
      publish_exact_frozen_bytes:
        description: Publish only the protected frozen bytes to every declared endpoint
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ait-release-endpoint-publication-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and read back the exact release family
    environment:
      name: pypi
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the reviewed release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Select fixed publishing runtimes
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Select fixed Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up the OCI builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Select required repository and signing tools
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in apt-cache apt-get dpkg-scanpackages gpg; do
            if ! command -v "${command}" >/dev/null 2>&1; then missing+=("${command}"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes dpkg-dev gnupg
          fi
          command -v dpkg-scanpackages >/dev/null
          command -v gpg >/dev/null
          command -v apt-get >/dev/null
          command -v apt-cache >/dev/null

      - name: Decode and validate the immutable publication request
        id: request
        shell: bash
        env:
          AIT_ENDPOINT_CONFIG_B64: ${{ inputs.endpoint_config_b64 }}
          AIT_ENDPOINT_CONFIG_SHA256: ${{ inputs.endpoint_config_sha256 }}
          AIT_GITHUB_TOKEN: ${{ github.token }}
          AIT_PROTECTED_RUN_ID: ${{ inputs.protected_run_id }}
          AIT_RELEASE_CONFIRM: ${{ inputs.publish_exact_frozen_bytes }}
          AIT_RELEASE_ID: ${{ inputs.release_id }}
          AIT_RELEASE_REPOSITORY: ${{ github.repository }}
          AIT_RELEASE_SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "${AIT_RELEASE_REPOSITORY}" = 'weita2026/ait-native'
          test "${AIT_RELEASE_SOURCE_REF}" = 'refs/heads/main'
          [[ "${AIT_RELEASE_ID}" =~ ^REL-FAM-[0-9A-F]{16}$ ]]
          [[ "${AIT_PROTECTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${AIT_ENDPOINT_CONFIG_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${AIT_RELEASE_CONFIRM}" = 'true'
          test "$(git -C control rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git -C control status --porcelain --untracked-files=all)"

          endpoint_config="${GITHUB_WORKSPACE}/endpoint-config.json"
          printf '%s' "${AIT_ENDPOINT_CONFIG_B64}" | base64 --decode >"${endpoint_config}"
          test "$(sha256sum "${endpoint_config}" | awk '{print $1}')" = \
            "${AIT_ENDPOINT_CONFIG_SHA256}"
          bash control/ci/release_operator.sh validate-config \
            --config "${endpoint_config}" \
            --expected-release-id "${AIT_RELEASE_ID}" >/dev/null
          test "$(jq -r '.protected_authorization.workflow_run_id' "${endpoint_config}")" = \
            "${AIT_PROTECTED_RUN_ID}"

          source_run="${RUNNER_TEMP}/source-run.json"
          source_artifact="${RUNNER_TEMP}/source-artifact.json"
          protected_run="${RUNNER_TEMP}/protected-run.json"
          protected_artifact="${RUNNER_TEMP}/protected-artifact.json"
          qualification_run="${RUNNER_TEMP}/qualification-run.json"
          candidate_artifact="${RUNNER_TEMP}/candidate-artifact.json"
          aggregate_artifact="${RUNNER_TEMP}/aggregate-artifact.json"
          source_run_id=$(jq -r '.source_dossier.workflow_run_id' "${endpoint_config}")
          source_artifact_id=$(jq -r '.source_dossier.artifact_id' "${endpoint_config}")
          protected_artifact_id=$(jq -r '.protected_authorization.artifact_id' "${endpoint_config}")
          qualification_run_id=$(jq -r '.pre_tag_qualification.workflow_run_id' "${endpoint_config}")
          candidate_artifact_id=$(jq -r '.pre_tag_qualification.candidate_artifact_id' "${endpoint_config}")
          aggregate_artifact_id=$(jq -r '.pre_tag_qualification.aggregate_artifact_id' "${endpoint_config}")
          api="https://api.github.com/repos/${AIT_RELEASE_REPOSITORY}"
          for request in \
            "actions/runs/${source_run_id}:${source_run}" \
            "actions/artifacts/${source_artifact_id}:${source_artifact}" \
            "actions/runs/${AIT_PROTECTED_RUN_ID}:${protected_run}" \
            "actions/artifacts/${protected_artifact_id}:${protected_artifact}" \
            "actions/runs/${qualification_run_id}:${qualification_run}" \
            "actions/artifacts/${candidate_artifact_id}:${candidate_artifact}" \
            "actions/artifacts/${aggregate_artifact_id}:${aggregate_artifact}"; do
            route=${request%%:*}
            destination=${request#*:}
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${AIT_GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/${route}" --output "${destination}"
          done
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].source_dossier.workflow_run_id and
            .run_attempt == $config[0].source_dossier.workflow_run_attempt and
            .name == "ait release component receipts" and
            .path == ".github/workflows/ait-release-component-receipts.yml" and
            .event == "workflow_dispatch" and .status == "completed" and
            .conclusion == "success" and
            .head_sha == $config[0].source_dossier.workflow_control_commit
          ' "${source_run}" >/dev/null
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].source_dossier.artifact_id and
            .name == ("ait-family-dossier-" + $config[0].release.id) and
            .digest == $config[0].source_dossier.artifact_digest and
            .expired == false and
            .workflow_run.id == $config[0].source_dossier.workflow_run_id
          ' "${source_artifact}" >/dev/null
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].protected_authorization.workflow_run_id and
            .run_attempt == $config[0].protected_authorization.workflow_run_attempt and
            .name == "ait release protected promotion" and
            .path == ".github/workflows/ait-release-protected-promotion.yml" and
            .event == "workflow_dispatch" and .status == "completed" and
            .conclusion == "success" and
            .head_sha == $config[0].protected_authorization.workflow_control_commit
          ' "${protected_run}" >/dev/null
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].protected_authorization.artifact_id and
            .name == ("ait-protected-promotion-" + $config[0].release.id) and
            .digest == $config[0].protected_authorization.artifact_digest and
            .expired == false and
            .workflow_run.id == $config[0].protected_authorization.workflow_run_id
          ' "${protected_artifact}" >/dev/null
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].pre_tag_qualification.workflow_run_id and
            .run_attempt == $config[0].pre_tag_qualification.workflow_run_attempt and
            .name == "ait release pre-tag candidate qualification" and
            .path == ".github/workflows/ait-release-pre-tag-qualification.yml" and
            .event == "workflow_dispatch" and .status == "completed" and
            .conclusion == "success" and
            .head_sha == $config[0].pre_tag_qualification.workflow_control_commit
          ' "${qualification_run}" >/dev/null
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].pre_tag_qualification.candidate_artifact_id and
            .name == ("ait-pre-tag-candidate-" + $config[0].release.id) and
            .digest == $config[0].pre_tag_qualification.candidate_artifact_digest and
            .expired == false and
            .workflow_run.id == $config[0].pre_tag_qualification.workflow_run_id
          ' "${candidate_artifact}" >/dev/null
          jq -e --slurpfile config "${endpoint_config}" '
            .id == $config[0].pre_tag_qualification.aggregate_artifact_id and
            .name == ("ait-pre-tag-clean-host-" + $config[0].release.id) and
            .digest == $config[0].pre_tag_qualification.aggregate_artifact_digest and
            .expired == false and
            .workflow_run.id == $config[0].pre_tag_qualification.workflow_run_id
          ' "${aggregate_artifact}" >/dev/null

          {
            echo "source_run_id=${source_run_id}"
            echo "source_artifact_id=${source_artifact_id}"
            echo "protected_run_id=${AIT_PROTECTED_RUN_ID}"
            echo "protected_artifact_id=${protected_artifact_id}"
            echo "protected_control_commit=$(jq -r '.protected_authorization.workflow_control_commit' "${endpoint_config}")"
            echo "protected_evidence_sha256=$(jq -r '.protected_authorization.evidence_sha256' "${endpoint_config}")"
            echo "qualification_run_id=${qualification_run_id}"
            echo "candidate_artifact_id=${candidate_artifact_id}"
            echo "candidate_artifact_digest=$(jq -r '.pre_tag_qualification.candidate_artifact_digest' "${endpoint_config}")"
            echo "candidate_status_sha256=$(jq -r '.pre_tag_qualification.candidate_status_sha256' "${endpoint_config}")"
            echo "aggregate_artifact_id=${aggregate_artifact_id}"
            echo "aggregate_artifact_digest=$(jq -r '.pre_tag_qualification.aggregate_artifact_digest' "${endpoint_config}")"
            echo "aggregate_status_sha256=$(jq -r '.pre_tag_qualification.aggregate_status_sha256' "${endpoint_config}")"
            echo "release_version=$(jq -r '.release.version' "${endpoint_config}")"
            echo "source_commit=$(jq -r '.release.source_commit' "${endpoint_config}")"
            echo "server_image=$(jq -r '.endpoints.oci.images[0]' "${endpoint_config}")"
            echo "runner_image=$(jq -r '.endpoints.oci.images[1]' "${endpoint_config}")"
            echo "immutable_tag=$(jq -r '.endpoints.oci.immutable_tag' "${endpoint_config}")"
            echo "moving_tag=$(jq -r '.endpoints.oci.moving_tag' "${endpoint_config}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Download the exact pre-tag candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.request.outputs.candidate_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: publication-stage
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.qualification_run_id }}

      - name: Download the successful pre-tag qualification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.request.outputs.aggregate_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: pre-tag-qualification
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.qualification_run_id }}

      - name: Download the exact protected authorization evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.request.outputs.protected_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: protected
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.protected_run_id }}

      - name: Require exact frozen bytes and all 32 clean-host rows before publication
        shell: bash
        run: |
          set -euo pipefail
          node control/ci/release_prepublish_verify.mjs stage \
            --root "${GITHUB_WORKSPACE}/publication-stage" \
            --config-sha256 \
              "$(sha256sum publication-stage/ait-release.endpoints.authority.json | awk '{print $1}')" \
            --status-sha256 '${{ steps.request.outputs.candidate_status_sha256 }}' \
            >/dev/null
          node control/ci/release_prepublish_verify.mjs qualify \
            --root "${GITHUB_WORKSPACE}/pre-tag-qualification" \
            --candidate-root "${GITHUB_WORKSPACE}/publication-stage" \
            --candidate-artifact-digest \
              '${{ steps.request.outputs.candidate_artifact_digest }}' \
            --aggregate-sha256 \
              '${{ steps.request.outputs.aggregate_status_sha256 }}' \
            >/dev/null
          bash control/ci/release_candidate_promote.sh \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/protected/ait-release.protected-promotion.json" \
            "${GITHUB_WORKSPACE}/pre-tag-qualification" \
            "${GITHUB_WORKSPACE}/publication-stage" >/dev/null
          mkdir publication-stage/pypi-dist
          cp publication-stage/assets/ait_native-*.whl publication-stage/pypi-dist/

      - name: Log in to the declared OCI registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Inspect authenticated immutable OCI restart state
        id: oci-preflight
        shell: bash
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh preflight-oci \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"
          receipt=publication-stage/evidence/oci-state.json
          {
            echo "server_present=$(jq -r '.images["ait-server"].present' "${receipt}")"
            echo "server_digest=$(jq -r '.images["ait-server"].digest // ""' "${receipt}")"
            echo "runner_present=$(jq -r '.images["ait-runner"].present' "${receipt}")"
            echo "runner_digest=$(jq -r '.images["ait-runner"].digest // ""' "${receipt}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Prove PyPI Trusted Publisher authentication without uploading
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error https://pypi.org/_/oidc/audience | jq -er .audience)" = pypi
          oidc_response="${RUNNER_TEMP}/pypi-oidc.json"
          mint_response="${RUNNER_TEMP}/pypi-mint.json"
          curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" \
            --output "${oidc_response}"
          oidc_token=$(jq -er .value "${oidc_response}")
          payload=$(jq -cn --arg token "${oidc_token}" '{token: $token}')
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            https://pypi.org/_/oidc/mint-token \
            --output "${mint_response}"
          pypi_token=$(jq -er .token "${mint_response}")
          echo "::add-mask::${pypi_token}"
          test "${pypi_token}" != 'null'
          echo 'AIT_PYPI_OIDC_PREFLIGHT=pass' >>"${GITHUB_ENV}"

      - name: Prove every authenticated endpoint before the first upload
        shell: bash
        env:
          AIT_APT_REPO_DEPLOY_KEY: ${{ secrets.AIT_APT_REPO_DEPLOY_KEY }}
          AIT_APT_SIGNING_FINGERPRINT: ${{ vars.AIT_APT_SIGNING_FINGERPRINT }}
          AIT_APT_SIGNING_KEY_B64: ${{ secrets.AIT_APT_SIGNING_KEY_B64 }}
          AIT_APT_SIGNING_PASSPHRASE: ${{ secrets.AIT_APT_SIGNING_PASSPHRASE }}
          AIT_GHCR_PREFLIGHT: pass
          AIT_GITHUB_TOKEN: ${{ github.token }}
          AIT_HOMEBREW_DEPLOY_KEY: ${{ secrets.AIT_HOMEBREW_DEPLOY_KEY }}
          AIT_NPM_TOKEN: ${{ secrets.AIT_NPM_TOKEN }}
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh preflight \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Attest every staged file before publication
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            publication-stage/assets/*
            publication-stage/ait-release.endpoint-publication.json

      - name: Admit the attested publication stage
        shell: bash
        run: echo 'AIT_STAGE_ATTESTATION_VERIFIED=true' >>"${GITHUB_ENV}"

      - name: Publish the six exact wheels through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publication-stage/pypi-dist
          verify-metadata: true
          skip-existing: true
          verbose: true
          print-hash: true
          attestations: true

      - name: Read back the PyPI wheel set
        shell: bash
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh publish-pypi \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the GitHub regular Release and exact assets
        shell: bash
        env:
          AIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh publish-github \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the exact pretested server image archives
        id: server-image
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.oci-preflight.outputs.server_digest }}
          EXISTING_PRESENT: ${{ steps.oci-preflight.outputs.server_present }}
        run: |
          set -euo pipefail
          existing=absent
          if [[ ${EXISTING_PRESENT} == true ]]; then existing=${EXISTING_DIGEST}; fi
          digest=$(bash control/ci/release_prepublish_oci.sh publish \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage" \
            ait-server "${existing}")
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Attest the server image in the registry
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.request.outputs.server_image }}
          subject-digest: ${{ steps.server-image.outputs.digest }}
          push-to-registry: true

      - name: Publish the exact pretested runner image archives
        id: runner-image
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.oci-preflight.outputs.runner_digest }}
          EXISTING_PRESENT: ${{ steps.oci-preflight.outputs.runner_present }}
        run: |
          set -euo pipefail
          existing=absent
          if [[ ${EXISTING_PRESENT} == true ]]; then existing=${EXISTING_DIGEST}; fi
          digest=$(bash control/ci/release_prepublish_oci.sh publish \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage" \
            ait-runner "${existing}")
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Attest the runner image in the registry
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.request.outputs.runner_image }}
          subject-digest: ${{ steps.runner-image.outputs.digest }}
          push-to-registry: true

      - name: Publish the exact Homebrew formula
        shell: bash
        env:
          AIT_HOMEBREW_DEPLOY_KEY: ${{ secrets.AIT_HOMEBREW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh publish-homebrew \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the signed apt repository
        shell: bash
        env:
          AIT_APT_REPO_DEPLOY_KEY: ${{ secrets.AIT_APT_REPO_DEPLOY_KEY }}
          AIT_APT_SIGNING_FINGERPRINT: ${{ vars.AIT_APT_SIGNING_FINGERPRINT }}
          AIT_APT_SIGNING_KEY_B64: ${{ secrets.AIT_APT_SIGNING_KEY_B64 }}
          AIT_APT_SIGNING_PASSPHRASE: ${{ secrets.AIT_APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh publish-apt \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish npm implementation payloads and command envelope
        shell: bash
        env:
          AIT_NPM_TOKEN: ${{ secrets.AIT_NPM_TOKEN }}
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh publish-npm \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Require anonymous OCI availability and exact filesystem readback
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null
          bash control/ci/release_endpoint_remote.sh readback-oci \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Verify public OCI provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_DIGEST: ${{ steps.runner-image.outputs.digest }}
          RUNNER_IMAGE: ${{ steps.request.outputs.runner_image }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
          SERVER_IMAGE: ${{ steps.request.outputs.server_image }}
        run: |
          set -euo pipefail
          for subject in \
            "${SERVER_IMAGE}@${SERVER_DIGEST}" \
            "${RUNNER_IMAGE}@${RUNNER_DIGEST}"; do
            gh attestation verify "oci://${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/pypi-publish.yml" \
              --source-ref refs/heads/main \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners \
              --bundle-from-oci >/dev/null
          done

      - name: Complete independent endpoint readback
        shell: bash
        env:
          AIT_APT_SIGNING_FINGERPRINT: ${{ vars.AIT_APT_SIGNING_FINGERPRINT }}
          AIT_GITHUB_TOKEN: ${{ github.token }}
          AIT_NPM_TOKEN: ${{ secrets.AIT_NPM_TOKEN }}
          AIT_OCI_RUNNER_DIGEST: ${{ steps.runner-image.outputs.digest }}
          AIT_OCI_SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
          AIT_PREPUBLISH_AGGREGATE_ARTIFACT_DIGEST: ${{ steps.request.outputs.aggregate_artifact_digest }}
          AIT_PREPUBLISH_AGGREGATE_STATUS_SHA256: ${{ steps.request.outputs.aggregate_status_sha256 }}
          AIT_PREPUBLISH_CANDIDATE_ARTIFACT_DIGEST: ${{ steps.request.outputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          bash control/ci/release_endpoint_remote.sh readback \
            "${GITHUB_WORKSPACE}/endpoint-config.json" \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Attest the endpoint publication evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: publication-stage/evidence/*.json

      - name: Upload the endpoint publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-endpoint-publication-${{ inputs.release_id }}
          path: publication-stage/evidence/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
