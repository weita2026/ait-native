name: ait-agent manager and worker native platforms

on:
  pull_request:
    paths:
      - ".github/workflows/ait-agent-worker-platforms.yml"
      - "rust/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ait-agent-worker-platforms.yml"
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust components
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Check native agent manager and worker
        run: cargo check --manifest-path rust/Cargo.toml -p ait-agent-core -p ait-agent-worker -p ait-cli --bin ait-agent

      - name: Test native agent runtime crates
        run: cargo test --manifest-path rust/Cargo.toml -p ait-agent-core -p ait-agent-worker -- --test-threads=1

      - name: Test native agent management commands
        run: cargo test --manifest-path rust/Cargo.toml -p ait-cli --test agent_cli --test public_cli_identity -- --test-threads=1

      - name: Report native manager identity
        run: cargo run --manifest-path rust/Cargo.toml -p ait-cli --bin ait-agent -- --version

      - name: Report native worker capabilities
        run: cargo run --manifest-path rust/Cargo.toml -p ait-agent-worker -- capabilities --json
