[package]
name = "ait-agent-worker"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "ait_agent_worker"
path = "src/lib.rs"

[[bin]]
name = "ait-agent-worker"
path = "src/main.rs"

[dependencies]
ait-agent-core = { path = "../ait-agent-core" }
ait-core = { path = "../ait-core" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[dev-dependencies]
assert_cmd = "2.0"
hmac = "0.12"
predicates = "3.1"
sha2 = "0.10"
tempfile = "3.12"
