[[external]]
name = "ait-db"
repo_name = "ait-db"
repository_index = 11
remote = "origin"
line = "main"
snapshot = "SNP-DB-RUST-PYTHON"
materialize_to = ".ait-external/ait-db"
license = "Apache-2.0"
version = "0.2.0"

[external.bindings.rust]
kind = "cargo-path"
path = "rust/crates/ait-db"
package = "ait-db"

[external.bindings.python]
kind = "python-path"
path = "python"
package = "ait-db"
module = "ait_db"
