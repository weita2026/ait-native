format = "ait.external.lock"

[[node]]
name = "ait-db"
repo_name = "ait-db"
repository_index = 11
remote = "origin"
line = "main"
snapshot = "SNP-DB-DIRECT"
parent_path = ""
materialize_to = ".ait-external/ait-db"
