[package]
name = "ait-py"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "ait_py"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
ait-agent-core = { path = "../ait-agent-core" }
ait-agent-worker = { path = "../ait-agent-worker" }
ait-cli = { path = "../ait-cli", default-features = false }
ait-core = { path = "../ait-core", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
sha2 = "0.10"

[dev-dependencies]
ait-core = { path = "../ait-core", default-features = false }
