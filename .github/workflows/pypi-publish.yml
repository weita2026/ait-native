name: ait release endpoint publication

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact protected release-family identity
        required: true
        type: string
      publish_exact_frozen_bytes:
        description: Publish only the protected frozen bytes to every declared RC endpoint
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ait-release-endpoint-publication-REL-FAM-0B6EDBCCA2EFE26B
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and read back the exact RC family
    environment:
      name: pypi
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the reviewed release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Select fixed publishing runtimes
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Select fixed Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up the OCI builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Select required repository and signing tools
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for command in dpkg-scanpackages gpg; do
            if ! command -v "${command}" >/dev/null 2>&1; then missing+=("${command}"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes dpkg-dev gnupg
          fi
          command -v dpkg-scanpackages >/dev/null
          command -v gpg >/dev/null

      - name: Validate the immutable publication request
        shell: bash
        env:
          AIT_GITHUB_TOKEN: ${{ github.token }}
          AIT_RELEASE_CONFIRM: ${{ inputs.publish_exact_frozen_bytes }}
          AIT_RELEASE_ID: ${{ inputs.release_id }}
          AIT_RELEASE_REPOSITORY: ${{ github.repository }}
          AIT_RELEASE_SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "${AIT_RELEASE_REPOSITORY}" = 'weita2026/ait-native'
          test "${AIT_RELEASE_SOURCE_REF}" = 'refs/heads/main'
          test "${AIT_RELEASE_ID}" = 'REL-FAM-0B6EDBCCA2EFE26B'
          test "${AIT_RELEASE_CONFIRM}" = 'true'
          test "$(git -C control rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git -C control status --porcelain --untracked-files=all)"

          endpoint_config=control/ait-core/release/endpoint-publication.rc2.json
          jq -e '
            .contract == "ait.release.family.endpoints/v1" and
            .release.id == "REL-FAM-0B6EDBCCA2EFE26B" and
            .release.version == "1.0.0-rc.2" and
            .release.tag == "v1.0.0-rc.2" and
            .release.source_commit == "3dfd9dde5a9867cfe265352f48540fa8241f8e66" and
            .source_dossier.workflow_run_id == 31629973956 and
            .source_dossier.artifact_id == 9155572246 and
            .protected_authorization.workflow_run_id == 31633959182 and
            .protected_authorization.artifact_id == 9156215006 and
            .publisher == {
              repository: "weita2026/ait-native",
              workflow: "pypi-publish.yml",
              environment: "pypi"
            }
          ' "${endpoint_config}" >/dev/null

          source_run="${RUNNER_TEMP}/source-run.json"
          source_artifact="${RUNNER_TEMP}/source-artifact.json"
          protected_run="${RUNNER_TEMP}/protected-run.json"
          protected_artifact="${RUNNER_TEMP}/protected-artifact.json"
          api=https://api.github.com/repos/weita2026/ait-native
          for request in \
            "actions/runs/31629973956:${source_run}" \
            "actions/artifacts/9155572246:${source_artifact}" \
            "actions/runs/31633959182:${protected_run}" \
            "actions/artifacts/9156215006:${protected_artifact}"; do
            route=${request%%:*}
            output=${request#*:}
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${AIT_GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/${route}" --output "${output}"
          done
          jq -e '
            .id == 31629973956 and
            .run_attempt == 1 and
            .name == "ait release component receipts" and
            .path == ".github/workflows/ait-release-component-receipts.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == "3dfd9dde5a9867cfe265352f48540fa8241f8e66"
          ' "${source_run}" >/dev/null
          jq -e '
            .id == 9155572246 and
            .name == "ait-family-dossier-REL-FAM-0B6EDBCCA2EFE26B" and
            .digest == "sha256:c474158c8d1c60ea31b7c32f179cf870154ca66ff0584aec936996bc76d13f1c" and
            .expired == false and
            .workflow_run.id == 31629973956
          ' "${source_artifact}" >/dev/null
          jq -e '
            .id == 31633959182 and
            .run_attempt == 1 and
            .name == "ait release protected promotion" and
            .path == ".github/workflows/ait-release-protected-promotion.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == "13718ab043f023aca838e3d8b80ffe9dbae289b6"
          ' "${protected_run}" >/dev/null
          jq -e '
            .id == 9156215006 and
            .name == "ait-protected-promotion-REL-FAM-0B6EDBCCA2EFE26B" and
            .digest == "sha256:facc6cc34d3543840b2f66952368d8e1f9b15e2b6e60e219138a22106e64a9ae" and
            .expired == false and
            .workflow_run.id == 31633959182
          ' "${protected_artifact}" >/dev/null

      - name: Download the exact frozen family dossier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '9155572246'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: dossier
          repository: weita2026/ait-native
          run-id: '31629973956'

      - name: Download the exact protected authorization
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '9156215006'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: protected
          repository: weita2026/ait-native
          run-id: '31633959182'

      - name: Verify protected authorization provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence=protected/ait-release.protected-promotion.json
          test "$(sha256sum "${evidence}" | awk '{print $1}')" = \
            'bf39d37aec86cbb83d58cdd218fb179668cabc08ca0c3b0049b9c6722245414d'
          gh attestation verify "${evidence}" \
            --repo weita2026/ait-native \
            --signer-workflow weita2026/ait-native/.github/workflows/ait-release-protected-promotion.yml \
            --source-ref refs/heads/main \
            --source-digest 13718ab043f023aca838e3d8b80ffe9dbae289b6 \
            --deny-self-hosted-runners \
            --format json > protected-attestation.json
          jq -e '
            length >= 1 and
            any(.[].verificationResult.statement.subject[];
              .name == "ait-release.protected-promotion.json" and
              .digest.sha256 == "bf39d37aec86cbb83d58cdd218fb179668cabc08ca0c3b0049b9c6722245414d")
          ' protected-attestation.json >/dev/null

      - name: Prepare only the exact frozen publication bytes
        shell: bash
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_publication.sh \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/dossier" \
            "${GITHUB_WORKSPACE}/protected/ait-release.protected-promotion.json" \
            "${GITHUB_WORKSPACE}/publication-stage"
          mkdir publication-stage/pypi-dist
          cp publication-stage/assets/ait_native-*.whl publication-stage/pypi-dist/

      - name: Log in to the declared OCI registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Inspect authenticated immutable OCI restart state
        id: oci-preflight
        shell: bash
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh preflight-oci \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"
          receipt=publication-stage/evidence/oci-state.json
          {
            echo "server-present=$(jq -r '.images["ait-server"].present' "${receipt}")"
            echo "server-digest=$(jq -r '.images["ait-server"].digest // ""' "${receipt}")"
            echo "runner-present=$(jq -r '.images["ait-runner"].present' "${receipt}")"
            echo "runner-digest=$(jq -r '.images["ait-runner"].digest // ""' "${receipt}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Prove PyPI Trusted Publisher authentication without uploading
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error https://pypi.org/_/oidc/audience | jq -er .audience)" = pypi
          oidc_response="${RUNNER_TEMP}/pypi-oidc.json"
          mint_response="${RUNNER_TEMP}/pypi-mint.json"
          curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" \
            --output "${oidc_response}"
          oidc_token=$(jq -er .value "${oidc_response}")
          payload=$(jq -cn --arg token "${oidc_token}" '{token: $token}')
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            https://pypi.org/_/oidc/mint-token \
            --output "${mint_response}"
          pypi_token=$(jq -er .token "${mint_response}")
          echo "::add-mask::${pypi_token}"
          test "${pypi_token}" != 'null'
          echo 'AIT_PYPI_OIDC_PREFLIGHT=pass' >> "${GITHUB_ENV}"

      - name: Prove every authenticated endpoint before the first upload
        shell: bash
        env:
          AIT_APT_REPO_DEPLOY_KEY: ${{ secrets.AIT_APT_REPO_DEPLOY_KEY }}
          AIT_APT_SIGNING_FINGERPRINT: ${{ vars.AIT_APT_SIGNING_FINGERPRINT }}
          AIT_APT_SIGNING_KEY_B64: ${{ secrets.AIT_APT_SIGNING_KEY_B64 }}
          AIT_APT_SIGNING_PASSPHRASE: ${{ secrets.AIT_APT_SIGNING_PASSPHRASE }}
          AIT_GHCR_PREFLIGHT: pass
          AIT_GITHUB_TOKEN: ${{ github.token }}
          AIT_HOMEBREW_DEPLOY_KEY: ${{ secrets.AIT_HOMEBREW_DEPLOY_KEY }}
          AIT_NPM_TOKEN: ${{ secrets.AIT_NPM_TOKEN }}
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh preflight \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Attest every staged file before publication
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            publication-stage/assets/*
            publication-stage/ait-release.endpoint-publication.json

      - name: Admit the attested publication stage
        shell: bash
        run: echo 'AIT_STAGE_ATTESTATION_VERIFIED=true' >> "${GITHUB_ENV}"

      - name: Publish npm implementation payloads and command envelope
        continue-on-error: true
        shell: bash
        env:
          AIT_NPM_TOKEN: ${{ secrets.AIT_NPM_TOKEN }}
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh publish-npm \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the six exact wheels through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publication-stage/pypi-dist
          verify-metadata: true
          skip-existing: true
          verbose: true
          print-hash: true
          attestations: true

      - name: Read back the PyPI wheel set
        shell: bash
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh publish-pypi \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the GitHub prerelease and exact assets
        shell: bash
        env:
          AIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh publish-github \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the immutable multi-platform server image
        id: build-server
        if: steps.oci-preflight.outputs.server-present != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: publication-stage/oci/ait-server
          file: publication-stage/oci/ait-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            AIT_RELEASE_SOURCE_COMMIT=3dfd9dde5a9867cfe265352f48540fa8241f8e66
            AIT_RELEASE_VERSION=1.0.0-rc.2
          tags: |
            ghcr.io/weita2026/ait-server:1.0.0-rc.2
            ghcr.io/weita2026/ait-server:rc

      - name: Select and route the exact server image digest
        id: server-image
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build-server.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.oci-preflight.outputs.server-digest }}
          EXISTING_PRESENT: ${{ steps.oci-preflight.outputs.server-present }}
        run: |
          set -euo pipefail
          digest=${BUILT_DIGEST}
          if [[ ${EXISTING_PRESENT} == true ]]; then digest=${EXISTING_DIGEST}; fi
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
          image=ghcr.io/weita2026/ait-server
          immutable=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "${image}:1.0.0-rc.2" | jq -er .digest)
          test "${immutable}" = "${digest}"
          moving=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "${image}:rc" 2>/dev/null | jq -r .digest || true)
          if [[ ${moving} != "${digest}" ]]; then
            docker buildx imagetools create --tag "${image}:rc" "${image}@${digest}"
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the server image in the registry
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/weita2026/ait-server
          subject-digest: ${{ steps.server-image.outputs.digest }}
          push-to-registry: true

      - name: Publish the immutable multi-platform runner image
        id: build-runner
        if: steps.oci-preflight.outputs.runner-present != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: publication-stage/oci/ait-runner
          file: publication-stage/oci/ait-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            AIT_RELEASE_SOURCE_COMMIT=3dfd9dde5a9867cfe265352f48540fa8241f8e66
            AIT_RELEASE_VERSION=1.0.0-rc.2
          tags: |
            ghcr.io/weita2026/ait-runner:1.0.0-rc.2
            ghcr.io/weita2026/ait-runner:rc

      - name: Select and route the exact runner image digest
        id: runner-image
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build-runner.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.oci-preflight.outputs.runner-digest }}
          EXISTING_PRESENT: ${{ steps.oci-preflight.outputs.runner-present }}
        run: |
          set -euo pipefail
          digest=${BUILT_DIGEST}
          if [[ ${EXISTING_PRESENT} == true ]]; then digest=${EXISTING_DIGEST}; fi
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
          image=ghcr.io/weita2026/ait-runner
          immutable=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "${image}:1.0.0-rc.2" | jq -er .digest)
          test "${immutable}" = "${digest}"
          moving=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "${image}:rc" 2>/dev/null | jq -r .digest || true)
          if [[ ${moving} != "${digest}" ]]; then
            docker buildx imagetools create --tag "${image}:rc" "${image}@${digest}"
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the runner image in the registry
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/weita2026/ait-runner
          subject-digest: ${{ steps.runner-image.outputs.digest }}
          push-to-registry: true

      - name: Publish the exact Homebrew RC formula
        shell: bash
        env:
          AIT_HOMEBREW_DEPLOY_KEY: ${{ secrets.AIT_HOMEBREW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh publish-homebrew \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Publish the signed apt testing repository
        shell: bash
        env:
          AIT_APT_REPO_DEPLOY_KEY: ${{ secrets.AIT_APT_REPO_DEPLOY_KEY }}
          AIT_APT_SIGNING_FINGERPRINT: ${{ vars.AIT_APT_SIGNING_FINGERPRINT }}
          AIT_APT_SIGNING_KEY_B64: ${{ secrets.AIT_APT_SIGNING_KEY_B64 }}
          AIT_APT_SIGNING_PASSPHRASE: ${{ secrets.AIT_APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh publish-apt \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Require anonymous OCI availability and exact filesystem readback
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null
          bash control/ait-core/ci/release_endpoint_remote.sh readback-oci \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Verify public OCI provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_DIGEST: ${{ steps.runner-image.outputs.digest }}
          SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          for subject in \
            "ghcr.io/weita2026/ait-server@${SERVER_DIGEST}" \
            "ghcr.io/weita2026/ait-runner@${RUNNER_DIGEST}"; do
            gh attestation verify "oci://${subject}" \
              --repo weita2026/ait-native \
              --signer-workflow weita2026/ait-native/.github/workflows/pypi-publish.yml \
              --source-ref refs/heads/main \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners \
              --bundle-from-oci >/dev/null
          done

      - name: Complete independent endpoint readback
        shell: bash
        env:
          AIT_APT_SIGNING_FINGERPRINT: ${{ vars.AIT_APT_SIGNING_FINGERPRINT }}
          AIT_GITHUB_TOKEN: ${{ github.token }}
          AIT_NPM_TOKEN: ${{ secrets.AIT_NPM_TOKEN }}
          AIT_OCI_RUNNER_DIGEST: ${{ steps.runner-image.outputs.digest }}
          AIT_OCI_SERVER_DIGEST: ${{ steps.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          bash control/ait-core/ci/release_endpoint_remote.sh readback \
            control/ait-core/release/endpoint-publication.rc2.json \
            "${GITHUB_WORKSPACE}/publication-stage"

      - name: Attest the endpoint publication evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: publication-stage/evidence/*.json

      - name: Upload the endpoint publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-endpoint-publication-REL-FAM-0B6EDBCCA2EFE26B
          path: publication-stage/evidence/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
