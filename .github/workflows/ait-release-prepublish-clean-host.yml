            }
            equal(phase.release.verification_stage, 'pre_tag');
            equal(phase.release.endpoint_config_sha256, digest(readFileSync(authorityFile)));
            equal(phase.release.operator_status_sha256, digest(readFileSync(statusFile)));
            equal(phase.release.candidate_stage_receipt_sha256, status.candidate.stage_receipt_sha256);
            equal(phase.release.candidate_artifact_digest, environment.AIT_CLEAN_HOST_CANDIDATE_ARTIFACT_DIGEST);
            for (const [field, expected] of Object.entries({ run_id: environment.GITHUB_RUN_ID,
              run_attempt: environment.GITHUB_RUN_ATTEMPT, job: environment.GITHUB_JOB,
              image_version: environment.ImageVersion, image_os: environment.ImageOS,
              runner_name: environment.RUNNER_NAME, label: row.runner })) equal(phase.runner[field], expected);
            const accepted = selectOriginal(phase, row);
            const { repository, cli, seed, task, snapshot, shown } = accepted;
            const parent = realpathSync(environment.RUNNER_TEMP);
            equal(path.dirname(path.dirname(repository)), parent);
            assert.match(path.basename(path.dirname(repository)), /^ait-clean-host-install-[a-zA-Z0-9]+$/);
            equal(realpathSync(repository), repository);
            equal(realpathSync(cli), cli);
            const assetName = `ait-${authority.release.version}-${row.target}`;
            const assets = phase.observations.github_assets.filter(asset => asset.name === assetName);
            equal(assets.length, 1);
            equal(assets[0].source, 'frozen_candidate_stage');
            equal(assets[0].digest, 'sha256:' + digest(readFileSync(cli)));
            equal(digest(readFileSync(path.join('candidate/assets', assetName))), digest(readFileSync(cli)));
            for (const [command, args] of [['/usr/bin/id', []], ['/usr/bin/uname', ['-a']],
              ['/usr/bin/sw_vers', []], ['/usr/bin/hdiutil', ['info']]]) probe('host-before', command, args);
            const mounts = probe('host-before', '/sbin/mount', []).stdout;
            assert(mounts.includes(' on /Volumes/AIT_RAM ('), 'original RAM mount is unavailable');
            assert.notEqual(statSync('/Volumes/AIT_RAM').dev, statSync('/Volumes').dev);
            equal(realpathSync(path.dirname(seed)), path.dirname(seed));
            probe('host-before', '/bin/ls', ['-ldeO@', repository, path.join(repository, '.ait/config.json'), path.dirname(seed)]);
            const writers = probe('host-before', '/usr/sbin/lsof', ['-F', 'pfa', '+D', repository, '+D', path.dirname(seed)], undefined, [0, 1]);
