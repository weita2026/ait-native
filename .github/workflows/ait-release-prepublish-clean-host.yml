          function validateObservation(text, pid, cli, seed) {
            assert(text.split('\n').some(line => line.startsWith(`LOADED pid=${pid} `) && line.endsWith(` executable=${cli}`)),
              'matching installed CLI loader PID required');
            const lines = text.split('\n');
            const begin = lines.findIndex(line => line.startsWith(`RENAME pid=${pid} `) &&
              line.includes(` src=${path.dirname(seed)}/.main-seed.tmp-`) && line.endsWith(` dst=${seed}`));
            assert(begin >= 0, 'matching staged-main-seed rename required');
            const end = lines.findIndex((line, index) => index > begin && line.startsWith(`RESULT pid=${pid} `));
            assert(end > begin, 'matching rename result required');
            const metadata = lines.slice(begin + 1, end);
            assert(!metadata.some(line => line.startsWith('RENAME ')), 'interleaved rename metadata unavailable');
            for (const label of ['source', 'destination', 'source_parent', 'destination_parent']) {
              assert(metadata.some(line => line.startsWith(`${label} path=`)), `pre-call ${label} metadata required`);
