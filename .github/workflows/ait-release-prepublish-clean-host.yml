name: ait release pre-tag clean host

on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      source_artifact_id:
        required: true
        type: string
      source_artifact_digest:
        required: true
        type: string
      candidate_authority_sha256:
        required: true
        type: string
      candidate_authority_b64:
        required: true
        type: string
      prior_version:
        required: true
        type: string
      prior_python_version:
        required: true
        type: string
    outputs:
      candidate_run_id:
        value: ${{ jobs.stage.outputs.candidate_run_id }}
      candidate_artifact_id:
        value: ${{ jobs.stage.outputs.candidate_artifact_id }}
      candidate_artifact_digest:
        value: ${{ jobs.stage.outputs.candidate_artifact_digest }}
      candidate_status_sha256:
        value: ${{ jobs.stage.outputs.candidate_status_sha256 }}
      aggregate_artifact_id:
        value: ${{ jobs.aggregate.outputs.aggregate_artifact_id }}
      aggregate_artifact_digest:
        value: ${{ jobs.aggregate.outputs.aggregate_artifact_digest }}
      aggregate_status_sha256:
        value: ${{ jobs.aggregate.outputs.aggregate_status_sha256 }}

permissions:
  actions: read
  contents: read

jobs:
  stage:
    name: Freeze the exact non-public installation stage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      rows: ${{ steps.matrix.outputs.rows }}
      platforms: ${{ steps.matrix.outputs.platforms }}
      matrix_sha256: ${{ steps.matrix.outputs.matrix_sha256 }}
      candidate_run_id: ${{ steps.select.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.select.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.select.outputs.candidate_artifact_digest }}
      candidate_status_sha256: ${{ steps.select.outputs.candidate_status_sha256 }}
      source_commit: ${{ steps.request.outputs.source_commit }}
    steps:
      - name: Check out the reviewed release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Select the fixed staging runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Set up the OCI archive builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Decode and bind the untagged frozen dossier
        id: request
        shell: bash
        env:
          AIT_AUTHORITY_B64: ${{ inputs.candidate_authority_b64 }}
          AIT_AUTHORITY_SHA: ${{ inputs.candidate_authority_sha256 }}
          AIT_RELEASE_ID: ${{ inputs.release_id }}
          AIT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          AIT_SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          AIT_SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${AIT_RELEASE_ID}" =~ ^REL-FAM-[0-9A-F]{16}$ ]]
          [[ "${AIT_SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${AIT_SOURCE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${AIT_SOURCE_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${AIT_AUTHORITY_SHA}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "${AIT_AUTHORITY_B64}" | base64 --decode >candidate-authority.json
          test "$(sha256sum candidate-authority.json | awk '{print $1}')" = \
            "${AIT_AUTHORITY_SHA}"
          bash control/ci/release_operator.sh validate-candidate-config \
            --config "${GITHUB_WORKSPACE}/candidate-authority.json" \
            --expected-release-id "${AIT_RELEASE_ID}" >/dev/null
          test "$(jq -r '.source_dossier.workflow_run_id' candidate-authority.json)" = \
            "${AIT_SOURCE_RUN_ID}"
          test "$(jq -r '.source_dossier.artifact_id' candidate-authority.json)" = \
            "${AIT_SOURCE_ARTIFACT_ID}"
          test "$(jq -r '.source_dossier.artifact_digest' candidate-authority.json)" = \
            "${AIT_SOURCE_ARTIFACT_DIGEST}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/actions/runs/${AIT_SOURCE_RUN_ID}" --output source-run.json
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/actions/artifacts/${AIT_SOURCE_ARTIFACT_ID}" \
            --output source-artifact.json
          jq -e --slurpfile authority candidate-authority.json \
            --argjson run_id "${AIT_SOURCE_RUN_ID}" '
              .id == $run_id and
              .run_attempt == $authority[0].source_dossier.workflow_run_attempt and
              .name == "ait release component receipts" and
              .path == ".github/workflows/ait-release-component-receipts.yml" and
              .event == "workflow_dispatch" and .status == "completed" and
              .conclusion == "success" and
              .head_sha == $authority[0].source_dossier.workflow_control_commit
            ' source-run.json >/dev/null
          jq -e --slurpfile authority candidate-authority.json \
            --argjson artifact_id "${AIT_SOURCE_ARTIFACT_ID}" \
            --argjson run_id "${AIT_SOURCE_RUN_ID}" \
            --arg digest "${AIT_SOURCE_ARTIFACT_DIGEST}" '
              .id == $artifact_id and
              .name == ("ait-family-dossier-" + $authority[0].release.id) and
              .digest == $digest and .expired == false and
              .workflow_run.id == $run_id
            ' source-artifact.json >/dev/null
          tag=$(jq -r '.release.tag' candidate-authority.json)
          source_commit=$(jq -r '.release.source_commit' candidate-authority.json)
          tag_rows="${RUNNER_TEMP}/pre-tag-rows"
          GIT_ASKPASS=/usr/bin/false GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= ls-remote --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              'v*' >"${tag_rows}"
          if awk -v tag="refs/tags/${tag}" -v commit="${source_commit}" '
            $1 == commit || $2 == tag || $2 == tag "^{}" { found = 1 }
            END { exit(found ? 0 : 1) }
          ' "${tag_rows}"; then
            echo 'release tag exists or a release tag already points at the candidate commit' >&2
            exit 1
          fi
          {
            echo "source_run_id=${AIT_SOURCE_RUN_ID}"
            echo "source_artifact_id=${AIT_SOURCE_ARTIFACT_ID}"
            echo "source_commit=${source_commit}"
          } >>"${GITHUB_OUTPUT}"

      - name: Download the exact frozen family dossier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.request.outputs.source_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: dossier
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}

      - name: Materialize packages and OCI archives before tag creation
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          bash control/ci/release_prepublish_stage.sh --pre-tag \
            "${GITHUB_WORKSPACE}/candidate-authority.json" \
            "${GITHUB_WORKSPACE}/dossier" \
            "${GITHUB_WORKSPACE}/candidate"
          status=candidate/ait-release.prepublish-candidate.json
          jq -e \
            --arg release_id '${{ inputs.release_id }}' \
            --arg commit '${{ steps.request.outputs.source_commit }}' '
              .contract == "ait.release.prepublish.candidate/v1" and
              .status == "frozen_candidate_pending_clean_host" and
              .release.id == $release_id and
              .release.source_commit == $commit and
              .qualification_stage == "pre_tag" and .tag_state == "absent" and
              .public_endpoint_writes == false
            ' "${status}" >/dev/null
          echo "candidate_status_sha256=$(sha256sum "${status}" | awk '{print $1}')" \
            >>"${GITHUB_OUTPUT}"

      - name: Generate the exact clean-host matrices
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=candidate/ait-release.clean-host-matrix.json
          node control/ci/release_clean_host.mjs matrix \
            --family control/ait-release-family.json \
            --platforms control/ci/native_bootstrap_matrix.json \
            --output "${GITHUB_WORKSPACE}/${matrix}" >/dev/null
          cp candidate-authority.json candidate/ait-release.endpoints.authority.json
          find candidate -type f ! -name PREPUBLISH_SHA256SUMS -print | LC_ALL=C sort |
            while IFS= read -r file; do
              printf '%s  %s\n' "$(sha256sum "${file}" | awk '{print $1}')" \
                "${file#candidate/}"
            done >candidate/PREPUBLISH_SHA256SUMS
          test "$(jq -r '.release.version' "${matrix}")" = \
            "$(jq -r '.release.version' candidate-authority.json)"
          {
            printf 'rows=%s\n' "$(jq -c '{include: .rows}' "${matrix}")"
            printf 'platforms=%s\n' \
              "$(jq -c '{include: .targets}' control/ci/native_bootstrap_matrix.json)"
            echo "matrix_sha256=$(sha256sum "${matrix}" | awk '{print $1}')"
          } >>"${GITHUB_OUTPUT}"
          node control/ci/release_prepublish_verify.mjs stage \
            --root "${GITHUB_WORKSPACE}/candidate" \
            --config-sha256 '${{ inputs.candidate_authority_sha256 }}' \
            --status-sha256 '${{ steps.stage.outputs.candidate_status_sha256 }}' >/dev/null

      - name: Upload the immutable pre-tag candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-pre-tag-candidate-${{ inputs.release_id }}
          path: candidate
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

      - name: Select the one immutable candidate identity
        id: select
        shell: bash
        env:
          AIT_NEW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          AIT_NEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          AIT_NEW_STATUS_SHA256: ${{ steps.stage.outputs.candidate_status_sha256 }}
        run: |
          set -euo pipefail
          candidate_run_id=${GITHUB_RUN_ID}
          candidate_artifact_id=${AIT_NEW_ARTIFACT_ID}
          candidate_artifact_digest=${AIT_NEW_ARTIFACT_DIGEST}
          if [[ ${candidate_artifact_digest} =~ ^[0-9a-f]{64}$ ]]; then
            candidate_artifact_digest=sha256:${candidate_artifact_digest}
          fi
          candidate_status_sha256=${AIT_NEW_STATUS_SHA256}
          [[ "${candidate_run_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${candidate_artifact_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${candidate_artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${candidate_status_sha256}" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "candidate_run_id=${candidate_run_id}"
            echo "candidate_artifact_id=${candidate_artifact_id}"
            echo "candidate_artifact_digest=${candidate_artifact_digest}"
            echo "candidate_status_sha256=${candidate_status_sha256}"
          } >>"${GITHUB_OUTPUT}"

  probe:
    needs: stage
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.stage.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out the exact release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Select the probe Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Activate preinstalled Linux Homebrew
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"

      - name: Bootstrap Windows Package Manager
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./control/ci/release_winget_bootstrap.ps1
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Hosted runner Git Bash is missing: $gitBash"
          }
          Split-Path -Parent $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save Windows bootstrap diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-winget-bootstrap-${{ github.job }}-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            winget-bootstrap*.log
            winget-bootstrap-error.txt
          if-no-files-found: warn


      - name: Probe exact runner capabilities
        shell: bash
        env:
          AIT_CLEAN_HOST_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          mkdir evidence
          node control/ci/release_clean_host_probe.mjs \
            --platforms control/ci/native_bootstrap_matrix.json \
            --target '${{ matrix.target }}' \
            --output "${PWD}/evidence/${{ matrix.target }}.json"

  install:
    needs: [stage, probe]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.stage.outputs.rows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out the exact release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out the exact candidate source for installed Core cases
        if: matrix.channel == 'github' && matrix.lifecycle == 'product'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.stage.outputs.source_commit }}
          path: source
          persist-credentials: false

      - name: Select the lifecycle Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Select Python for the PyPI row
        id: python
        if: matrix.channel == 'pypi'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Activate preinstalled Linux Homebrew
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"

      - name: Bootstrap Windows Package Manager
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./control/ci/release_winget_bootstrap.ps1
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Hosted runner Git Bash is missing: $gitBash"
          }
          Split-Path -Parent $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save Windows bootstrap diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-winget-bootstrap-${{ github.job }}-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            winget-bootstrap*.log
            winget-bootstrap-error.txt
          if-no-files-found: warn


      - name: Download the immutable pre-tag candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.stage.outputs.candidate_run_id }}

      - name: Verify candidate inventory and execute clean install
        id: phase
        continue-on-error: true
        shell: bash
        env:
          AIT_CLEAN_HOST_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.stage.outputs.candidate_artifact_digest }}
          AIT_CLEAN_HOST_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          AIT_CLEAN_HOST_SOURCE_ROOT: ${{ github.workspace }}/source
          AIT_CLEAN_HOST_PYTHON: ${{ steps.python.outputs.python-path }}
          AIT_CLEAN_HOST_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          node control/ci/release_prepublish_verify.mjs stage \
            --root "${PWD}/candidate" \
            --config-sha256 '${{ inputs.candidate_authority_sha256 }}' \
            --status-sha256 '${{ needs.stage.outputs.candidate_status_sha256 }}' >/dev/null
          mkdir evidence
          node control/ci/release_clean_host_phase.mjs run \
            --matrix "${PWD}/candidate/ait-release.clean-host-matrix.json" \
            --row-id '${{ matrix.id }}' \
            --config "${PWD}/candidate/ait-release.endpoints.authority.json" \
            --status "${PWD}/candidate/ait-release.prepublish-candidate.json" \
            --phase install \
            --prior-version '${{ inputs.prior_version }}' \
            --prior-python-version '${{ inputs.prior_python_version }}' \
            --output "${PWD}/evidence/install.json"

      - name: Upload install-phase evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-pre-tag-install-${{ inputs.release_id }}-${{ matrix.id }}
          path: evidence/install.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Enforce clean-install success
        if: always()
        shell: bash
        run: |
          test '${{ steps.phase.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success

  upgrade:
    needs: [stage, install]
    if: ${{ always() && needs.stage.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.stage.outputs.rows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out the exact release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Select the lifecycle Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Select Python for the PyPI row
        id: python
        if: matrix.channel == 'pypi'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Activate preinstalled Linux Homebrew
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"

      - name: Bootstrap Windows Package Manager
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./control/ci/release_winget_bootstrap.ps1
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Hosted runner Git Bash is missing: $gitBash"
          }
          Split-Path -Parent $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save Windows bootstrap diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-winget-bootstrap-${{ github.job }}-${{ matrix.target }}-${{ strategy.job-index }}
          path: |
            winget-bootstrap*.log
            winget-bootstrap-error.txt
          if-no-files-found: warn


      - name: Download the immutable pre-tag candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.stage.outputs.candidate_run_id }}

      - name: Download matching install evidence
        id: download_install
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ait-pre-tag-install-${{ inputs.release_id }}-${{ matrix.id }}
          path: evidence/install

      - name: Verify candidate inventory and execute exact upgrade
        id: phase
        continue-on-error: true
        shell: bash
        env:
          AIT_CLEAN_HOST_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.stage.outputs.candidate_artifact_digest }}
          AIT_CLEAN_HOST_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          AIT_CLEAN_HOST_PYTHON: ${{ steps.python.outputs.python-path }}
          AIT_CLEAN_HOST_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          node control/ci/release_prepublish_verify.mjs stage \
            --root "${PWD}/candidate" \
            --config-sha256 '${{ inputs.candidate_authority_sha256 }}' \
            --status-sha256 '${{ needs.stage.outputs.candidate_status_sha256 }}' >/dev/null
          mkdir -p evidence/row
          node control/ci/release_clean_host_phase.mjs run \
            --matrix "${PWD}/candidate/ait-release.clean-host-matrix.json" \
            --row-id '${{ matrix.id }}' \
            --config "${PWD}/candidate/ait-release.endpoints.authority.json" \
            --status "${PWD}/candidate/ait-release.prepublish-candidate.json" \
            --phase upgrade \
            --prior-version '${{ inputs.prior_version }}' \
            --prior-python-version '${{ inputs.prior_python_version }}' \
            --output "${PWD}/evidence/upgrade.json"

      - name: Bind both fresh-host phases into one row
        id: combine
        if: always()
        continue-on-error: true
        shell: bash
        env:
          AIT_CLEAN_HOST_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.stage.outputs.candidate_artifact_digest }}
        run: |
          node control/ci/release_clean_host.mjs combine \
            --matrix "${PWD}/candidate/ait-release.clean-host-matrix.json" \
            --config "${PWD}/candidate/ait-release.endpoints.authority.json" \
            --status "${PWD}/candidate/ait-release.prepublish-candidate.json" \
            --install "${PWD}/evidence/install/install.json" \
            --upgrade "${PWD}/evidence/upgrade.json" \
            --output "${PWD}/evidence/row/${{ matrix.id }}.json"

      - name: Upload immutable row evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-pre-tag-row-${{ inputs.release_id }}-${{ matrix.id }}
          path: evidence/row/${{ matrix.id }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Enforce upgrade and row success
        if: always()
        shell: bash
        run: |
          test '${{ steps.download_install.outcome }}' = success
          test '${{ steps.phase.outcome }}' = success
          test '${{ steps.combine.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success

  aggregate:
    needs: [stage, probe, install, upgrade]
    if: ${{ always() && needs.stage.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      aggregate_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      aggregate_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      aggregate_status_sha256: ${{ steps.aggregate.outputs.aggregate_status_sha256 }}
      mac_seed_row: ${{ steps.seed_observation.outputs.row }}
      mac_seed_runner: ${{ steps.seed_observation.outputs.runner }}
    steps:
      - name: Check out the exact release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Select the aggregation Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Download every available immutable row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ait-pre-tag-row-${{ inputs.release_id }}-*
          path: rows
          merge-multiple: true

      - name: Download the immutable candidate authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.stage.outputs.candidate_run_id }}

      # Selection is read-only and optional. Its output never enters the
      # qualification inventory, status, or caller's published outputs.
      - name: Select an original Mac seed failure for observation
        id: seed_observation
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const matrix = read('candidate/ait-release.clean-host-matrix.json');
          const authority = read('candidate/ait-release.endpoints.authority.json');
          const selected = matrix.rows.filter(row => row.channel === 'github' &&
            row.lifecycle === 'product' && row.target === 'aarch64-apple-darwin');
          assert.equal(selected.length, 1);
          const [row] = selected;
          assert.equal(row.os, 'macos');
          assert.equal(row.architecture, 'arm64');
          const original = read(`rows/${row.id}.json`);
          assert.equal(original.contract, 'ait.release.clean-host.row/v1');
          assert.deepEqual(original.row, row);
          assert.equal(original.release.id, authority.release.id);
          assert.equal(original.release.source_commit, authority.release.source_commit);
          const phase = original.phases.install;
          assert.deepEqual(phase.row, row);
          assert.deepEqual(phase.release, original.release);
          const failedSeed = phase.status === 'fail' && phase.commands.some(command => {
            if (command.label !== 'candidate task finish' || command.exit_status !== 2) return false;
            try {
              const seed = JSON.parse(command.stdout_tail).main_seed_sync;
              return seed?.status === 'failed' &&
                /Failed to install staged main seed/.test(seed.error ?? '') &&
                /Permission denied \(os error 13\)/.test(seed.error ?? '');
            } catch { return false; }
          });
          if (failedSeed) {
            assert.match(row.id, /^[a-z0-9-]+$/);
            assert.match(row.runner, /^[a-z0-9-]+$/);
            appendFileSync(process.env.GITHUB_OUTPUT, `row=${row.id}\nrunner=${row.runner}\n`);
          }
          NODE

      - name: Aggregate the complete pre-tag row inventory
        id: aggregate
        continue-on-error: true
        shell: bash
        env:
          AIT_CLEAN_HOST_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.stage.outputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p rows
          node control/ci/release_clean_host.mjs aggregate \
            --matrix "${PWD}/candidate/ait-release.clean-host-matrix.json" \
            --config "${PWD}/candidate/ait-release.endpoints.authority.json" \
            --status "${PWD}/candidate/ait-release.prepublish-candidate.json" \
            --evidence-root "${PWD}/rows" \
            --output-root "${RUNNER_TEMP}/pre-tag-aggregate"
          cp candidate/ait-release.prepublish-candidate.json \
            "${RUNNER_TEMP}/pre-tag-aggregate/"
          find "${RUNNER_TEMP}/pre-tag-aggregate" -type f ! -name SHA256SUMS \
            -print | LC_ALL=C sort |
            while IFS= read -r file; do
              printf '%s  %s\n' "$(sha256sum "${file}" | awk '{print $1}')" \
                "${file#"${RUNNER_TEMP}/pre-tag-aggregate/"}"
            done >"${RUNNER_TEMP}/pre-tag-aggregate/SHA256SUMS"
          status="${RUNNER_TEMP}/pre-tag-aggregate/ait-release.clean-host-status.json"
          test "$(jq -r '.status' "${status}")" = qualified
          aggregate_sha=$(sha256sum "${status}" | awk '{print $1}')
          node control/ci/release_prepublish_verify.mjs qualify \
            --root "${RUNNER_TEMP}/pre-tag-aggregate" \
            --candidate-root "${PWD}/candidate" \
            --candidate-artifact-digest \
              '${{ needs.stage.outputs.candidate_artifact_digest }}' \
            --aggregate-sha256 "${aggregate_sha}" >/dev/null
          echo "aggregate_status_sha256=${aggregate_sha}" >>"${GITHUB_OUTPUT}"

      - name: Recheck tag absence at qualification closeout
        shell: bash
        run: |
          set -euo pipefail
          tag=$(jq -r '.release.tag' candidate/ait-release.endpoints.authority.json)
          source_commit=$(jq -r '.release.source_commit' \
            candidate/ait-release.endpoints.authority.json)
          tag_rows="${RUNNER_TEMP}/pre-tag-closeout-rows"
          GIT_ASKPASS=/usr/bin/false GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= ls-remote --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              'v*' >"${tag_rows}"
          if awk -v tag="refs/tags/${tag}" -v commit="${source_commit}" '
            $1 == commit || $2 == tag || $2 == tag "^{}" { found = 1 }
            END { exit(found ? 0 : 1) }
          ' "${tag_rows}"; then
            echo 'release tag appeared or a release tag now points at the candidate commit' >&2
            exit 1
          fi

      - name: Upload the pre-tag qualification evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-pre-tag-clean-host-${{ inputs.release_id }}
          path: ${{ runner.temp }}/pre-tag-aggregate
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

      - name: Enforce qualification before returning to publication
        if: always()
        shell: bash
        run: |
          test '${{ steps.aggregate.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success

  # This single optional job observes only the failed ARM64 first-Task case.
  # Every qualifying install/upgrade remains uninstrumented. Nothing below
  # is consumed by aggregate or exported as qualification evidence.
  mac_seed_observation:
    needs: [stage, aggregate]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && needs.aggregate.outputs.mac_seed_row != '' }}
    continue-on-error: true
    runs-on: ${{ needs.aggregate.outputs.mac_seed_runner }}
    timeout-minutes: 20
    steps:
      - name: Check out the exact diagnostic control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Select the same lifecycle Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Download the same immutable pre-tag candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage.outputs.candidate_artifact_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ needs.stage.outputs.candidate_run_id }}

      - name: Compile the read-only seed rename observer
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="${RUNNER_TEMP}/mac-seed-observation"
          mkdir "${diagnostic}"
          {
            id; uname -a; sw_vers; /sbin/mount
            printf 'ImageOS=%s ImageVersion=%s RUNNER_NAME=%s RUNNER_ARCH=%s\n' \
              "${ImageOS:-}" "${ImageVersion:-}" "${RUNNER_NAME:-}" "${RUNNER_ARCH:-}"
          } >"${diagnostic}/host-before.log" 2>&1
          cat >"${diagnostic}/rename-observer.c" <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/acl.h>
          #include <sys/syscall.h>
          #include <mach-o/dyld.h>
          #include <limits.h>

          __attribute__((constructor)) static void loaded(void) {
            int saved = errno;
            const char *p = getenv("CORE_SEED_RENAME_LOG");
            if (p) {
              FILE *f = fopen(p, "a");
              if (f) {
                char exe[PATH_MAX]; uint32_t size = sizeof(exe);
                if (_NSGetExecutablePath(exe, &size)) snprintf(exe, sizeof(exe), "unavailable");
                fprintf(f, "LOADED pid=%d euid=%d egid=%d executable=%s\n",
                  getpid(), geteuid(), getegid(), exe);
                fclose(f);
              }
            }
            errno = saved;
          }
          static void describe(FILE *f, const char *label, const char *p) {
            struct stat s;
            if (lstat(p, &s)) {
              fprintf(f, "%s path=%s lstat_errno=%d\n", label, p, errno); return;
            }
            int writable = access(p, W_OK), access_errno = writable ? errno : 0;
            fprintf(f, "%s path=%s uid=%u gid=%u mode=%o flags=%u write_access=%d access_errno=%d\n",
              label, p, s.st_uid, s.st_gid, s.st_mode, s.st_flags, writable, access_errno);
            struct statfs v;
            if (!statfs(p, &v)) fprintf(f, "%s fs=%s mount=%s mount_flags=%llu\n",
              label, v.f_fstypename, v.f_mntonname, (unsigned long long)v.f_flags);
            else fprintf(f, "%s statfs_errno=%d\n", label, errno);
            acl_t a = acl_get_file(p, ACL_TYPE_EXTENDED);
            if (a) {
              ssize_t len = 0; char *t = acl_to_text(a, &len);
              if (t) { fprintf(f, "%s ACL=%.*s\n", label, (int)len, t); acl_free(t); }
              else fprintf(f, "%s acl_text_errno=%d\n", label, errno);
              acl_free(a);
            } else fprintf(f, "%s acl_errno=%d\n", label, errno);
          }
          static void describe_at(FILE *f, const char *label, int fd, const char *p) {
            char full[PATH_MAX], base[PATH_MAX];
            if (p[0] == '/') {
              if (snprintf(full, sizeof(full), "%s", p) >= (int)sizeof(full)) {
                fprintf(f, "%s metadata_path_too_long\n", label); return;
              }
            }
            else if (fd == AT_FDCWD ? getcwd(base, sizeof(base)) != NULL : fcntl(fd, F_GETPATH, base) != -1) {
              if (snprintf(full, sizeof(full), "%s/%s", base, p) >= (int)sizeof(full)) {
                fprintf(f, "%s metadata_path_too_long\n", label); return;
              }
            } else { fprintf(f, "%s metadata_path_errno=%d\n", label, errno); return; }
            describe(f, label, full);
            char *last = strrchr(full, '/');
            if (last) {
              if (last == full) last[1] = '\0'; else *last = '\0';
              char parent_label[64]; snprintf(parent_label, sizeof(parent_label), "%s_parent", label);
              describe(f, parent_label, full);
            }
          }
          static FILE *before(int sfd, const char *src, int dfd, const char *dst) {
            const char *log = getenv("CORE_SEED_RENAME_LOG");
            if (!log || !src || !dst || (!strstr(src, "main-seed") && !strstr(dst, "main-seed"))) return NULL;
            FILE *f = fopen(log, "a"); if (!f) return NULL;
            fprintf(f, "RENAME pid=%d euid=%d egid=%d sfd=%d src=%s dfd=%d dst=%s\n",
              getpid(), geteuid(), getegid(), sfd, src, dfd, dst);
            describe_at(f, "source", sfd, src); describe_at(f, "destination", dfd, dst);
            fflush(f); return f;
          }
          static int observed_rename(const char *src, const char *dst) {
            int saved = errno; FILE *f = before(AT_FDCWD, src, AT_FDCWD, dst); errno = saved;
            int r = (int)syscall(SYS_rename, src, dst), e = errno;
            if (f) { fprintf(f, "RESULT pid=%d result=%d errno=%d\n", getpid(), r, e); fclose(f); }
            errno = e; return r;
          }
          static int observed_renameat(int sfd, const char *src, int dfd, const char *dst) {
            int saved = errno; FILE *f = before(sfd, src, dfd, dst); errno = saved;
            int r = (int)syscall(SYS_renameat, sfd, src, dfd, dst), e = errno;
            if (f) { fprintf(f, "RESULT pid=%d renameat result=%d errno=%d\n", getpid(), r, e); fclose(f); }
            errno = e; return r;
          }
          #define INTERPOSE(replacement, replacee) \
          __attribute__((used)) static struct { const void *replacement; const void *replacee; } interpose_##replacee \
          __attribute__((section("__DATA,__interpose"))) = {(const void *)(uintptr_t)&replacement, (const void *)(uintptr_t)&replacee};
          INTERPOSE(observed_rename, rename)
          INTERPOSE(observed_renameat, renameat)
          C
          clang -dynamiclib -Wall -Wextra -o "${diagnostic}/rename-observer.dylib" \
            "${diagnostic}/rename-observer.c" >"${diagnostic}/compile.log" 2>&1

      - name: Observe only the existing first-Task case
        shell: bash
        env:
          AIT_CLEAN_HOST_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.stage.outputs.candidate_artifact_digest }}
          AIT_CLEAN_HOST_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          AIT_CLEAN_HOST_RUNNER_LABEL: ${{ needs.aggregate.outputs.mac_seed_runner }}
          AIT_SEED_OBSERVATION_ROW: ${{ needs.aggregate.outputs.mac_seed_row }}
          AIT_SEED_OBSERVATION_PRIOR: ${{ inputs.prior_version }}
          AIT_SEED_OBSERVATION_PRIOR_PYTHON: ${{ inputs.prior_python_version }}
        run: |
          set -euo pipefail
          node control/ci/release_prepublish_verify.mjs stage \
            --root "${PWD}/candidate" \
            --config-sha256 '${{ inputs.candidate_authority_sha256 }}' \
            --status-sha256 '${{ needs.stage.outputs.candidate_status_sha256 }}' >/dev/null
          node --input-type=module >"${RUNNER_TEMP}/mac-seed-observation/commands.log" 2>&1 <<'NODE'
          import { readFileSync, realpathSync, mkdtempSync, existsSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          try {
          const diagnostic = path.join(process.env.RUNNER_TEMP, 'mac-seed-observation');
          const phaseFile = path.resolve('control/ci/release_clean_host_phase.mjs');
          // Expose private helpers only in this ephemeral diagnostic module.
          // Their implementations and the installed family bytes are unchanged.
          let source = readFileSync(phaseFile, 'utf8').replaceAll(
            /from "\.\/([^"\n]+)"/g,
            (_, relative) => `from ${JSON.stringify(pathToFileURL(path.join(path.dirname(phaseFile), relative)).href)}`);
          const guard = 'if (process.argv[1] && realpathSync(process.argv[1]) === fileURLToPath(import.meta.url)) {';
          if (!source.includes(guard)) throw new Error('diagnostic module entry guard changed');
          source = source.replace(guard, 'if (false) {') +
            '\nexport { Recorder, validateInputs, nativePlatform, githubRunner, candidateRoot, githubContext, exactContextVersion, exerciseLifecycle, firstLand };\n';
          const api = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
          const read = file => JSON.parse(readFileSync(path.join('candidate', file), 'utf8'));
          const config = read('ait-release.endpoints.authority.json');
          const status = read('ait-release.prepublish-candidate.json');
          const row = api.validateInputs({ 'row-id': process.env.AIT_SEED_OBSERVATION_ROW,
            'prior-version': process.env.AIT_SEED_OBSERVATION_PRIOR,
            'prior-python-version': process.env.AIT_SEED_OBSERVATION_PRIOR_PYTHON },
            read('ait-release.clean-host-matrix.json'), config, status);
          api.nativePlatform(row); api.githubRunner(row);
          const recorder = new api.Recorder();
          const root = mkdtempSync(path.join(realpathSync(process.env.RUNNER_TEMP), 'ait-clean-host-install-'));
          let caseError;
          try {
            const context = await api.githubContext(config, row, config.release.version, root, recorder, api.candidateRoot(status));
            api.exactContextVersion(context, row, config.release.version, recorder);
            await api.exerciseLifecycle(context, row, root, recorder);
            context.ait.environment = { ...context.ait.environment,
              DYLD_INSERT_LIBRARIES: path.join(diagnostic, 'rename-observer.dylib'),
              CORE_SEED_RENAME_LOG: path.join(diagnostic, 'rename.log') };
            api.firstLand(recorder, context.ait, path.join(root, 'candidate-repository'),
              `clean-host ${row.id} ${config.release.version}\n`, null, null, config.release.version);
            console.log('Diagnostic first-Task case passed; ordinary qualification retains its original result.');
          } catch (error) {
            caseError = error;
          } finally {
            for (const command of recorder.commands) {
              console.log(`\n${command.label} | ${command.command} | exit ${command.exit_status}\n${command.stdout_tail}\n${command.stderr_tail}`);
            }
          }
          if (caseError) console.log(`Diagnostic first-Task case failed: ${caseError.message}`);
          const log = path.join(diagnostic, 'rename.log');
          if (!existsSync(log)) throw new Error('Observer unavailable: no loader/rename log was produced.');
          const observation = readFileSync(log, 'utf8');
          const loaded = [...observation.matchAll(/^LOADED pid=(\d+) .* executable=.*\/github-bin\/ait$/gm)].map(match => match[1]);
          if (!loaded.some(pid => observation.includes(`RENAME pid=${pid} `) && observation.includes(`RESULT pid=${pid} `))) {
            throw new Error('Observer unavailable: matching installed CLI LOADED/RENAME/RESULT records are required.');
          }
          console.log('Observer captured the diagnostic case before native cleanup; this is not qualification evidence.');
          if (caseError) throw caseError;
          } catch (error) { console.error(error.message); process.exitCode = 1; }
          NODE

      - name: Save final diagnostic host mounts
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/mac-seed-observation"
          /sbin/mount >"${RUNNER_TEMP}/mac-seed-observation/host-after.log" 2>&1

      # Use the existing bootstrap-diagnostic retention default. The four
      # qualification artifacts retain their separate retention contract.
      - name: Retain isolated Mac observation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-macos-seed-observation-${{ inputs.release_id }}
          path: ${{ runner.temp }}/mac-seed-observation/*.log
          if-no-files-found: warn
          compression-level: 0
