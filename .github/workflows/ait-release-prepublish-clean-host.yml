              equal(current.status, 'completed'); same(current.local_finish, accepted.receipt);
              const reconciliation = cliJson(['workflow', 'reconcile', '--task', task, '--dry-run', '--json']);
              equal(reconciliation.status, 'completed'); equal(reconciliation.mutated, false);
              same(reconciliation.actions ?? [], []);
              same(reconciliation.findings, []); equal(reconciliation.summary.remaining_count, 0);
              equal(reconciliation.summary.total_finding_count, 0);
