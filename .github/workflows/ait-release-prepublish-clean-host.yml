            assert.match(started.edit_root, /^\/Volumes\/AIT_RAM\/\.ait-repos\/[a-f0-9]+\/candidate-repository\/lt-[0-9]+$/);
            equal(first.cwd, started.edit_root);
            equal(start.cwd, repository);
            equal(resume.cwd, repository);
            equal(init.command, commandText(cli, ['init', '--json']));
            equal(start.command, commandText(cli, ['task', 'start', '--from',
              'docs/sprints/clean_host.md#clean-host/first-land', '--intent', 'Prove exact clean-host first land', '--json']));
            equal(first.command, commandText(cli, ['task', 'finish', task, '--message',
              'Clean-host first Snapshot', '--local', '--json', '--full']));
            equal(resume.command, commandText(cli, ['task', 'finish', task, '--local', '--json', '--full']));
            const accepted = { task, snapshot, target, repository, cli, receipt: landed.local_finish,
              seed: path.join(path.dirname(started.edit_root), '.ait-internal', 'main-seed') };
