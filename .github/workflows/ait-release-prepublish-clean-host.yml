            equal(reconcile.mutated, false);
            equal(reconcile.receipt_store_mutated, false);
            same(reconcile.actions, []);
            same(reconcile.findings, []);
            equal(reconcile.summary?.remaining_count, 0);
            const restore = value.repo_root_restore;
