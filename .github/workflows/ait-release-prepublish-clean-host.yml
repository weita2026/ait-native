          set -euo pipefail
          diagnostic="${RUNNER_TEMP}/mac-seed-observation"
          node control/ci/release_prepublish_verify.mjs stage \
            --root "${PWD}/candidate" \
            --config-sha256 "${AIT_SEED_OBSERVATION_CONFIG_SHA}" \
            --status-sha256 "${AIT_SEED_OBSERVATION_STATUS_SHA}" \
