            validateCloseout(resumed, accepted, true);
            equal(landed.bound_worktree_cleanup.worktree.path, started.edit_root);
            const shown = response(one('candidate integrated Snapshot show'));
            equal(shown.snapshot_id, snapshot);
            equal(shown.parent_snapshot_id, started.head_snapshot_id);
