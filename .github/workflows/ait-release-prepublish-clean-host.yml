            equal(line.task_status, 'completed');
            equal(line.target_line, target);
            equal(line.expected_revision_snapshot_id, snapshot);
            equal(line.local.line?.head_snapshot_id, snapshot);
            equal(line.local.line?.status, 'archived');
            equal(value.plan_checklist_closeout?.status, 'synced');
