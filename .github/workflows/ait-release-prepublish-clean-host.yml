            equal(value.task_status, 'completed');
            equal(value.task.status, 'completed');
            equal(value.apply_status, 'done');
            equal(value.target_line, target);
            equal(value.current_line, target);
            equal(value.line_name, target);
            equal(value.landed_snapshot_id, snapshot);
            for (const field of ['change', 'change_id', 'change_ref', 'change_status']) equal(value[field], null);
            same(value.local_finish, receipt);
            same(value.task.local_finish, receipt);
            equal(receipt.status, 'succeeded');
            equal(receipt.task_id, task);
            equal(receipt.landed_snapshot_id, snapshot);
            equal(receipt.target_line, target);
            equal(receipt.change_ref, null);
            equal(value.execution_status, recovery ? 'already_landed' : 'applied');
            if (recovery) equal(value.auto_snapshot, null);
