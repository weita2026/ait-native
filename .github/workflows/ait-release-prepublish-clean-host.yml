      # Keep the existing diagnostic retention default and separate artifact.
      - name: Retain isolated Mac observation logs
        if: ${{ always() && matrix.channel == 'github' && matrix.lifecycle == 'product' && matrix.target == 'aarch64-apple-darwin' && steps.phase.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-macos-seed-observation-${{ inputs.release_id }}
          path: ${{ runner.temp }}/mac-seed-observation/*.log
          if-no-files-found: warn
          compression-level: 0

      - name: Upload install-phase evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ait-pre-tag-install-${{ inputs.release_id }}-${{ matrix.id }}
          path: evidence/install.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Enforce clean-install success
        if: always()
        shell: bash
        run: |
          test '${{ steps.phase.outcome }}' = success
          test '${{ steps.upload.outcome }}' = success

  upgrade:
    needs: [stage, install]
    if: ${{ always() && needs.stage.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.stage.outputs.rows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out the exact release-control source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Select the lifecycle Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.5.0"
          check-latest: false

      - name: Select Python for the PyPI row
        id: python
        if: matrix.channel == 'pypi'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Activate preinstalled Linux Homebrew
        if: runner.os == 'Linux'
